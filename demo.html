<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ensayo · La sala vs. el TEC</title>
<!--
  ENSAYO EN UNA SOLA PÁGINA: la pantalla del expositor + dos celulares
  simulados (versión ligera y versión completa), todo en modo demo, sin internet.
  Esta página reenvía los mensajes entre los tres marcos (postMessage).
-->
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#2a0a0c;color:#fff;height:100vh;display:flex;flex-direction:column}
.top{padding:10px 18px;display:flex;gap:16px;align-items:center;font-size:14px}
.top b{letter-spacing:.14em;color:#E9AA8C}
.top span{opacity:.8}
.grid{flex:1;display:grid;grid-template-columns:1fr 300px 300px;gap:14px;padding:0 14px 14px;min-height:0}
.pant{background:#000;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pant iframe{flex:1;border:0;width:100%}
.tel{display:flex;flex-direction:column;align-items:center;min-height:0}
.tel small{margin-bottom:6px;color:#E9AA8C;font-weight:700;letter-spacing:.08em}
.marco{flex:1;width:100%;max-height:640px;border:10px solid #111;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.marco iframe{width:100%;height:100%;border:0}
@media(max-width:1000px){.grid{grid-template-columns:1fr;overflow:auto}.pant{min-height:60vh}.marco{height:600px}}
</style>
</head>
<body>
<div class="top"><b>ENSAYO</b><span>Usa los botones de la pantalla (◀ ▶, Revelar, ✋, 🧪 Simular) y responde desde los dos celulares.</span></div>
<div class="grid">
  <div class="pant"><iframe id="f0" src="pantalla.html?demo"></iframe></div>
  <div class="tel"><small>CELULAR · VERSIÓN LIGERA</small><div class="marco"><iframe id="f1" name="yo1" src="index.html?demo&yo=1&c=AMOR26&lig=index.html"></iframe></div></div>
  <div class="tel"><small>CELULAR · VERSIÓN COMPLETA</small><div class="marco"><iframe id="f2" name="yo2" src="completa.html?demo&yo=2&c=AMOR26&lig=index.html"></iframe></div></div>
</div>
<script>
// Reenvía cada mensaje de un marco a los otros dos (el "wifi" del ensayo)
var marcos=[0,1,2].map(function(i){return document.getElementById("f"+i)});
addEventListener("message",function(e){
  if(!e.data||!e.data.__svt)return;
  marcos.forEach(function(f){if(f.contentWindow!==e.source)try{f.contentWindow.postMessage(e.data,"*")}catch(x){}});
});
</script>
</body>
</html>
